version: '3.8'

services:
  api:
    build: .
    container_name: compliance_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/compliance_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_MOCK_MODE=false
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://localstack:4566
    depends_on:
      - postgres
      - neo4j
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compliance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.20.0-community
    container_name: compliance_neo4j
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: compliance_redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    container_name: compliance_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs

volumes:
  postgres_data:
  neo4j_data:
